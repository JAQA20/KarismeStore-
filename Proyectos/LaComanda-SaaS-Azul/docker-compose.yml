version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    container_name: lacomanda_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: lacomanda_backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=mysql://root:rootpassword@db:3306/la_comanda
      - PORT=3000
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: lacomanda_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=la_comanda
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
