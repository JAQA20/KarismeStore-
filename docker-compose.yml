services:
  frontend:
    build:
      context: ./frontend
    container_name: karisme_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file:
      - ./frontend/.env.local
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: karisme_backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=mysql://root:root_password@db:3306/karisme_db
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=karisme_db
      - DB_PORT=3306
      - PORT=5001
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: karisme_db
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=karisme_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/proto.sql:/docker-entrypoint-initdb.d/proto.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
